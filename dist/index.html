<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>3D Simya Oyunu</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: fixed;
        touch-action: none;
        background-color: #07080a;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100% !important;
        height: 100% !important;
        touch-action: none;
      }

      /* Kum Saati Loading Ekranı */
      #loading-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at 50% 45%, #18191a 0%, #0d0d0d 65%, #07080a 100%);
        transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.5s ease;
        opacity: 1;
        visibility: visible;
        touch-action: none;
        pointer-events: all;
      }

      #loading-screen.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
      }

      .hourglass-box {
        position: relative;
        width: 90px;
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .hourglass-glow {
        position: absolute;
        width: 110px;
        height: 110px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(245, 158, 11, 0.3) 0%, rgba(217, 119, 6, 0.08) 50%, transparent 70%);
        animation: pulseGlow 3s ease-in-out infinite;
        pointer-events: none;
      }

      .hourglass-rotator {
        width: 80px;
        height: 104px;
        animation: rotateLoop 3s cubic-bezier(0.77, 0, 0.175, 1) infinite;
        transform-origin: 50% 50%;
      }

      /* 0s - 2.2s kum akar, 2.3s - 3.0s arası 180 derece döner */
      @keyframes rotateLoop {
        0%, 73% {
          transform: rotate(0deg);
        }
        85%, 100% {
          transform: rotate(180deg);
        }
      }

      @keyframes pulseGlow {
        0%, 100% {
          transform: scale(0.9);
          opacity: 0.6;
        }
        50% {
          transform: scale(1.15);
          opacity: 1;
        }
      }

      /* Üst Hazne Kumu: 0% dolu -> 72% boşalır */
      .sand-top {
        transform-origin: 50px 65px;
        animation: emptyTop 3s ease-in-out infinite;
      }

      @keyframes emptyTop {
        0% {
          transform: scaleY(1);
        }
        70%, 100% {
          transform: scaleY(0);
        }
      }

      /* Akan Kum Çizgisi */
      .sand-stream {
        animation: streamFlow 3s ease-in-out infinite;
      }

      @keyframes streamFlow {
        0%, 5% {
          opacity: 0;
        }
        8%, 68% {
          opacity: 1;
        }
        72%, 100% {
          opacity: 0;
        }
      }

      /* Alt Hazne Kumu: 0% boş -> 72% dolar */
      .sand-bottom {
        transform-origin: 50px 110px;
        animation: fillBottom 3s ease-in-out infinite;
      }

      @keyframes fillBottom {
        0%, 6% {
          transform: scaleY(0);
        }
        70%, 82% {
          transform: scaleY(1);
        }
        100% {
          transform: scaleY(1);
        }
      }

      .loading-text-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .loading-title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 3px;
        color: #f8fafc;
        text-shadow: 0 0 16px rgba(251, 191, 36, 0.5);
        animation: textPulse 2.5s ease-in-out infinite;
      }

      .loading-subtitle {
        font-size: 11.5px;
        font-weight: 500;
        color: #94a3b8;
        letter-spacing: 0.8px;
        margin-top: 6px;
      }

      @keyframes textPulse {
        0%, 100% { opacity: 0.85; }
        50% { opacity: 1; text-shadow: 0 0 22px rgba(251, 191, 36, 0.8); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CzXSz9lx.js"></script>
  </head>
  <body>
    <!-- Kum Saati Oyun Yükleniyor Ekranı -->
    <div id="loading-screen">
      <div class="loading-content">
        <div class="hourglass-box">
          <div class="hourglass-glow"></div>
          <div class="hourglass-rotator">
            <svg viewBox="0 0 100 130" width="80" height="104">
              <defs>
                <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#fde047" />
                  <stop offset="50%" stop-color="#d97706" />
                  <stop offset="100%" stop-color="#b45309" />
                </linearGradient>
                <linearGradient id="sand-grad" x1="0%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" stop-color="#fef08a" />
                  <stop offset="60%" stop-color="#f59e0b" />
                  <stop offset="100%" stop-color="#d97706" />
                </linearGradient>
                <linearGradient id="glass-shine" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stop-color="rgba(255,255,255,0.45)" />
                  <stop offset="40%" stop-color="rgba(255,255,255,0.05)" />
                  <stop offset="100%" stop-color="rgba(255,255,255,0.15)" />
                </linearGradient>
                <clipPath id="top-bulb-clip">
                  <path d="M 22 22 L 78 22 C 76 50 54 58 52 65 C 48 58 24 50 22 22 Z" />
                </clipPath>
                <clipPath id="bottom-bulb-clip">
                  <path d="M 50 65 C 54 72 76 80 78 108 L 22 108 C 24 80 46 72 50 65 Z" />
                </clipPath>
              </defs>

              <!-- Ahşap/Altın Üst ve Alt Kaideler -->
              <rect x="14" y="12" width="72" height="8" rx="3" fill="url(#gold-grad)" stroke="#78350f" stroke-width="1.5" />
              <rect x="26" y="8" width="48" height="5" rx="2" fill="url(#gold-grad)" />
              <rect x="14" y="110" width="72" height="8" rx="3" fill="url(#gold-grad)" stroke="#78350f" stroke-width="1.5" />
              <rect x="26" y="117" width="48" height="5" rx="2" fill="url(#gold-grad)" />

              <!-- Yan Sütunlar -->
              <line x1="18" y1="20" x2="18" y2="110" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" />
              <line x1="82" y1="20" x2="82" y2="110" stroke="url(#gold-grad)" stroke-width="3.5" stroke-linecap="round" />

              <!-- Cam Gövde Arka Planı -->
              <path d="M 22 20 C 22 50 46 60 48 65 C 46 70 22 80 22 110 L 78 110 C 78 80 54 70 52 65 C 54 60 78 50 78 20 Z"
                    fill="rgba(15, 23, 42, 0.55)" stroke="#94a3b8" stroke-width="1.5" stroke-opacity="0.45" />

              <!-- Üst Haznedeki Kum (Gittikçe Azalır) -->
              <g clip-path="url(#top-bulb-clip)">
                <rect class="sand-top" x="15" y="20" width="70" height="46" fill="url(#sand-grad)" />
              </g>

              <!-- Dökülen Kum Çizgisi -->
              <line class="sand-stream" x1="50" y1="63" x2="50" y2="108" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" />

              <!-- Alt Haznede Biriken Kum -->
              <g clip-path="url(#bottom-bulb-clip)">
                <path class="sand-bottom" d="M 18 110 Q 50 82 82 110 Z" fill="url(#sand-grad)" />
              </g>

              <!-- Cam Üzerindeki Parlama Yansıması -->
              <path d="M 28 24 C 28 46 42 54 46 60 C 45 59 32 48 30 24 Z" fill="url(#glass-shine)" />
            </svg>
          </div>
        </div>

        <div class="loading-text-container">
          <div class="loading-title" id="loading-title-text">OYUN YÜKLENİYOR...</div>
          <div class="loading-subtitle" id="loading-subtitle-text">Simya atölyesi ve karakter hazırlanıyor</div>
        </div>
      </div>
    </div>

    <div id="app">
      <canvas id="canvas"></canvas>
    </div>
  </body>
</html>
