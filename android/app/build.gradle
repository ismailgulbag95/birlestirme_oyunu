apply plugin: 'com.android.application'

android {
    namespace "com.birlestirme.oyunu"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.birlestirme.oyunu"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        resValue "string", "admob_app_id", "ca-app-pub-3940256099942544~3347511713"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
            storeFile file(keystorePath ?: 'missing-upload-key.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            def productionAdMobAppId = project.findProperty('ADMOB_APP_ID') ?: System.getenv('ADMOB_APP_ID')
            if (productionAdMobAppId) {
                resValue "string", "admob_app_id", productionAdMobAppId
            }
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register('verifyReleaseAdMobConfig') {
    doLast {
        def appId = project.findProperty('ADMOB_APP_ID') ?: System.getenv('ADMOB_APP_ID')
        def rewardedAdUnitId = System.getenv('VITE_ADMOB_REWARDED_AD_UNIT_ID')
        def keystorePath = System.getenv('ANDROID_KEYSTORE_PATH')
        def signingValues = [
            keystorePath,
            System.getenv('ANDROID_KEYSTORE_PASSWORD'),
            System.getenv('ANDROID_KEY_ALIAS'),
            System.getenv('ANDROID_KEY_PASSWORD')
        ]
        if (!appId || !rewardedAdUnitId) {
            throw new GradleException('Set ADMOB_APP_ID and VITE_ADMOB_REWARDED_AD_UNIT_ID before creating a release build.')
        }
        if (!(appId ==~ /ca-app-pub-\d+~\d+/) || !(rewardedAdUnitId ==~ /ca-app-pub-\d+\/\d+/)) {
            throw new GradleException('AdMob release IDs must use the application-ID and rewarded-ad-unit formats shown in docs/RELEASE.md.')
        }
        if (signingValues.any { !it } || !file(keystorePath).isFile()) {
            throw new GradleException('Set the four ANDROID_KEYSTORE_* signing variables to an existing upload keystore before creating a release build.')
        }
        if (appId == 'ca-app-pub-3940256099942544~3347511713' || rewardedAdUnitId == 'ca-app-pub-3940256099942544/5224354917') {
            throw new GradleException('Google test ad IDs are blocked in release builds.')
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn('verifyReleaseAdMobConfig')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
