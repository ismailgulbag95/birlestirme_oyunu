name: Web Build & Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Web Build & Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Web Uygulamasını Derle (Vite Build)
        run: npm run build

      - name: Web Build Dosyalarını Artifact Olarak Yükle (İndirilebilir Zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-build
          path: dist/
          retention-days: 14

      - name: Pages İçin Artifact Hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy-pages:
    name: GitHub Pages Canlı Yayın
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e Dağıt (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
