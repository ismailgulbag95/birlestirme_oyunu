name: Web Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Web Build & Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Web Uygulamasını Derle (Vite Build)
        run: npm run build

      - name: Web Build Dosyalarını Artifact Olarak Yükle (İndirilebilir Zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-build
          path: dist/
          retention-days: 14
