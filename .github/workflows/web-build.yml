name: Web Build & Test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Aşama: Web Build alma ve İndirilebilir Zip Artifact oluşturma
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Çek (Checkout)
        uses: actions/checkout@v4

      - name: Node.js Ortamını Kur
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Bağımlılıkları Yükle
        run: npm ci

      - name: Web Uygulamasını Derle (Vite Build)
        run: npm run build

      - name: Web Build Dosyalarını Artifact Olarak Yükle (İndirilebilir Zip)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-build
          path: dist/
          retention-days: 14

      # Pages için artifact hazırla
      - name: Pages İçin Artifact Yükle
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: 'dist'

  # 2. Aşama: Opsiyonel GitHub Pages Dağıtımı (Pages açık değilse bile build'i bozmaz)
  deploy-pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # Repo ayarlarında Pages kapalıysa bile workflow'u failure yapmaz
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e Dağıt (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
