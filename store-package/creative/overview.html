<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curio Alchemy store package overview</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1020; }
    body { color: #f8f4e8; padding: 34px 46px; font-family: Arial, Helvetica, sans-serif; }
    h1 { margin: 0 0 28px; color: #f4c66c; font-size: 32px; letter-spacing: 1px; }
    .locale { margin: 0 0 14px; color: #fff; font-size: 22px; letter-spacing: 1px; }
    .row { display: flex; justify-content: center; gap: 24px; margin-bottom: 34px; }
    figure { margin: 0; width: 390px; text-align: center; }
    figure img { display: block; width: 100%; height: auto; border: 1px solid rgba(244,198,108,.5); border-radius: 14px; }
    figcaption { margin-top: 8px; color: #c9cede; font-size: 14px; letter-spacing: 1px; }
    .bottom { display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: -1px; }
    .feature { width: 450px; height: 220px; object-fit: cover; border: 1px solid rgba(244,198,108,.45); border-radius: 12px; }
    .icon { width: 92px; height: 92px; border-radius: 22px; border: 1px solid rgba(244,198,108,.55); }
  </style>
</head>
<body>
  <h1>CURIO ALCHEMY · STORE CREATIVE OVERVIEW</h1>
  <div class="locale">ENGLISH — APP STORE SCREENSHOTS</div>
  <div class="row">
    <figure><img src="/store-package/assets/app-store/en/01-start.png"><figcaption>01 · START</figcaption></figure>
    <figure><img src="/store-package/assets/app-store/en/02-combine.png"><figcaption>02 · COMBINE</figcaption></figure>
    <figure><img src="/store-package/assets/app-store/en/03-collection.png"><figcaption>03 · COLLECTION</figcaption></figure>
  </div>
  <div class="locale">TÜRKÇE — APP STORE EKRAN GÖRÜNTÜLERİ</div>
  <div class="row">
    <figure><img src="/store-package/assets/app-store/tr/01-start.png"><figcaption>01 · BAŞLANGIÇ</figcaption></figure>
    <figure><img src="/store-package/assets/app-store/tr/02-combine.png"><figcaption>02 · BİRLEŞTİR</figcaption></figure>
    <figure><img src="/store-package/assets/app-store/tr/03-collection.png"><figcaption>03 · KOLEKSİYON</figcaption></figure>
  </div>
  <div class="bottom">
    <img class="feature" src="/store-package/assets/google-play/en/feature-graphic.png">
    <img class="feature" src="/store-package/assets/google-play/tr/feature-graphic.png">
    <img class="icon" src="/store-package/assets/brand/brand-icon-a-play-512.png">
    <img class="icon" src="/store-package/assets/brand/brand-icon-b-play-512.png">
  </div>
  <script>
    const images = [...document.images];
    Promise.all(images.map(image => image.decode().catch(() => {}))).then(() => { document.body.dataset.creativeReady = 'true'; });
  </script>
</body>
</html>
